[project]
name = "saiu-do-seu-bolso"
version = "0.1.0"
description = "Dados parlamentares oficiais em linguagem simples."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Projeto Saiu do Seu Bolso" }]
dependencies = [
    "tqdm>=4.67.0",
]

[project.scripts]
deputados = "deputados.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deputados"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
