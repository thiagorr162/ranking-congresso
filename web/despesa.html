<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Detalhamento de uma despesa parlamentar." />
    <title>Detalhe da despesa — Ranking do Congresso</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="casa.js" defer></script>
    <script src="despesa.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./"><span class="brand-mark">RC</span><span>Ranking do Congresso</span></a>
    </header>
    <main>
      <a id="voltar" class="back-link" href="./">← Voltar às despesas</a>
      <section id="conteudo" hidden>
        <div class="page-heading">
          <p class="eyebrow">DESPESA INDIVIDUAL</p>
          <h1 id="senador"></h1>
          <p id="categoria"></p>
          <strong id="valor" class="expense-amount"></strong>
        </div>
        <div class="expense-detail-grid">
          <article class="fact wide"><span>Detalhamento</span><strong id="detalhamento"></strong></article>
          <article class="fact"><span>Fornecedor</span><strong id="fornecedor"></strong><small id="cpf-cnpj"></small></article>
          <article class="fact"><span>Documento</span><strong id="tipo-documento"></strong><small id="documento"></small></article>
          <article class="fact"><span>Data</span><strong id="data"></strong><small id="referencia"></small></article>
          <article class="fact"><span>Identificador oficial</span><strong id="identificador"></strong></article>
          <article id="viagem-card" class="fact" hidden><span>Passageiro</span><strong id="passageiro"></strong><small id="trecho"></small></article>
          <article id="comprovante-card" class="fact" hidden><span>Comprovante</span><strong><a id="comprovante" class="expense-link" target="_blank" rel="noreferrer">Ver nota fiscal ↗</a></strong></article>
        </div>
        <section class="expense-context">
          <h2>Contexto no ano</h2>
          <div class="detail-grid context-grid">
            <article class="metric-card"><span>Mesmo fornecedor</span><strong id="total-fornecedor"></strong><small id="quantidade-fornecedor"></small></article>
            <article class="metric-card"><span>Mesma categoria</span><strong id="total-categoria"></strong><small id="quantidade-categoria"></small></article>
            <article class="metric-card"><span>Total no mês</span><strong id="total-mes"></strong><small id="participacao-mes"></small></article>
          </div>
          <p id="aviso-dados" class="data-notice"></p>
        </section>
        <section class="detail-section"><a id="fonte" class="official-link" target="_blank" rel="noreferrer">Conferir fonte oficial ↗</a></section>
      </section>
      <p id="erro" class="error" hidden>Não foi possível carregar esta despesa.</p>
    </main>
  </body>
</html>
