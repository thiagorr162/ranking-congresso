<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Projetos de lei e PECs apresentados por um parlamentar." />
    <title>Projetos — Saiu do Seu Bolso</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="casa.js" defer></script>
    <script src="projetos.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./"><span class="brand-mark">SB</span><span>Saiu do Seu Bolso</span></a>
    </header>
    <main>
      <a id="voltar" class="back-link" href="./">← Voltar</a>
      <section id="conteudo" hidden>
        <div class="page-heading">
          <p class="eyebrow">PROJETOS</p>
          <h1 id="nome"></h1>
          <p>Projetos de lei e PECs apresentados no ano, como autor ou coautor.</p>
        </div>
        <div class="detail-grid">
          <article class="metric-card"><span>Projetos no ano</span><strong id="projetos"></strong></article>
          <article class="metric-card"><span>Em tramitação</span><strong id="tramitando"></strong></article>
          <article class="metric-card"><span>Autorias no total</span><strong id="autorias"></strong><small>Inclui requerimentos e indicações</small></article>
          <article class="metric-card"><span>Atuando desde</span><strong id="exercicio"></strong><small id="participacao"></small></article>
        </div>
        <section class="detail-section">
          <div class="filters" role="group" aria-label="Filtrar projetos">
            <button class="selected" data-filter="todos">Todos</button>
            <button data-filter="tramitando">Em tramitação</button>
            <button data-filter="encerrados">Encerrados</button>
          </div>
          <p id="contagem" class="result-count"></p>
          <div class="table-wrap">
            <table class="expenses-table">
              <thead><tr><th>Data</th><th>Projeto</th><th>Ementa</th><th>Situação</th></tr></thead>
              <tbody id="lista"></tbody>
            </table>
          </div>
        </section>
      </section>
      <p id="erro" class="error" hidden>Não foi possível carregar os projetos.</p>
    </main>
  </body>
</html>
